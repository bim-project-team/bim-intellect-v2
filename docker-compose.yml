version: "3.9"
services:
  neo4j:
    image: neo4j:5.20
    container_name: bim-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/bimintellect
      # Required for dynamic labels (apoc.create.addLabels) and dynamic
      # relationship types (apoc.create.relationship) used by our loader,
      # since the IFC type / relationship type are only known at load time.
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
